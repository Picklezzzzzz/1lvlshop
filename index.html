<style>
:root{
  --bg:#faf6f4;--bg-soft:#f2e9e4;--surface:#fff;--text:#3a2a28;--muted:#8f7870;--line:#eadfd8;
  --accent:#c45d6a;--accent-2:#a34856;--accent-light:#d47884;--accent-soft:#f8e8ea;
  --warm:#c9954a;--danger:#c45a5a;--radius:16px;--radius-sm:12px;
  --shadow-sm:0 1px 3px rgba(58,42,40,.04),0 4px 14px rgba(58,42,40,.05);
  --shadow:0 4px 8px rgba(58,42,40,.04),0 12px 28px rgba(58,42,40,.08);
  --shadow-lg:0 12px 40px rgba(58,42,40,.12);
  --font:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{scroll-behavior:smooth;scroll-padding-top:100px;touch-action:manipulation}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  background-image:
    radial-gradient(ellipse 70% 45% at 8% -8%,rgba(196,93,106,.12),transparent 55%),
    radial-gradient(ellipse 55% 35% at 92% 0%,rgba(201,149,74,.1),transparent 50%),
    linear-gradient(180deg,#f8f1ee 0%,#faf6f4 45%,#f7f3ef 100%);
  background-attachment:fixed;
}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
a{touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
.container{width:100%;max-width:1360px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:50;background:rgba(255,252,250,.94);backdrop-filter:blur(16px) saturate(1.15);border-bottom:1px solid rgba(234,223,216,.9)}
.head-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(180px,420px) minmax(0,1fr);align-items:center;gap:16px;padding:12px 0}
.logo{display:inline-flex;align-items:center;justify-self:start;text-decoration:none;line-height:0;max-width:min(420px,58vw)}
.logo img{display:block;height:96px;width:auto;max-width:100%;object-fit:contain;object-position:left center}
.head-search{position:relative;width:100%;min-width:0}
.head-search input{width:100%;height:42px;padding:0 42px 0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.92);outline:0;font-weight:500;transition:border-color .15s,box-shadow .15s;line-height:normal}
.head-search input::placeholder{color:#a89088;font-weight:500}
.head-search input:focus{border-color:var(--accent-light);box-shadow:0 0 0 3px rgba(196,93,106,.14)}
.head-search input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.head-search input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.head-search svg.search-icon{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--muted);pointer-events:none;opacity:.75;
}
.head-search__clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:8px;display:none;place-items:center;
  color:var(--muted);opacity:.75;touch-action:manipulation;
}
.head-search__clear svg{width:16px;height:16px;display:block}
.head-search__clear:hover{opacity:1;background:rgba(58,42,40,.06)}
.head-search.is-filled .search-icon{display:none}
.head-search.is-filled .head-search__clear{display:grid}
.search-suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;max-height:min(380px,60vh);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px}
.search-suggest[hidden]{display:none !important}
.search-suggest__item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;width:100%;text-align:left;transition:background .12s}
.search-suggest__item:hover{background:var(--accent-soft)}
.search-suggest__thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--bg-soft);display:grid;place-items:center}
.search-suggest__thumb img{width:100%;height:100%;object-fit:cover}
.search-suggest__ph{width:100%;height:100%;display:grid;place-items:center;font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(58,42,40,.4)}
.search-suggest__name{font-size:.84rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-suggest__price{font-size:.86rem;font-weight:700;color:var(--accent-2);margin-top:2px}
.search-suggest__add{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--accent-light),var(--accent-2))}
.search-suggest__empty{padding:14px;text-align:center;color:var(--muted);font-weight:550;font-size:.88rem}
.head-right{display:flex;align-items:center;justify-content:flex-end;justify-self:end}
.cart-btn{position:relative;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--accent-light),var(--accent-2));box-shadow:0 3px 12px rgba(163,72,86,.28);transition:transform .18s ease,box-shadow .18s}
.cart-btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(163,72,86,.34)}
.cart-btn svg{width:24px;height:24px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--warm);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;border:2px solid #fff;transform:scale(0);transition:transform .25s cubic-bezier(.34,1.4,.64,1)}
.badge.show{transform:scale(1)}
.hero{
  margin:16px 0 28px;padding:56px 28px 52px;border-radius:22px;text-align:center;position:relative;overflow:hidden;
  min-height:clamp(280px,42vw,380px);display:grid;place-items:center;
  background:#3a2a28 center / cover no-repeat url("/img/hero-bg.jpg");
  border:1px solid rgba(58,42,40,.12);box-shadow:var(--shadow);
  animation:heroIn .65s ease both;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(40,28,26,.28) 0%,rgba(40,28,26,.12) 40%,rgba(40,28,26,.35) 100%);
}
.hero::after{content:none}
.hero-inner{
  position:relative;z-index:2;max-width:32rem;padding:14px 18px 16px;
  background:rgba(255,252,250,.9);border:1px solid rgba(255,255,255,.65);
  border-radius:16px;box-shadow:0 8px 28px rgba(40,28,26,.16);
  backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);
}
.hero h1{
  margin:0 0 6px;font-family:var(--font);
  font-size:clamp(1.45rem,3.4vw,2.05rem);font-weight:800;line-height:1.15;letter-spacing:-.035em;
  color:var(--text);max-width:18ch;margin-left:auto;margin-right:auto;
}
.hero-lead{margin:0 auto 14px;max-width:30ch;font-size:.9rem;line-height:1.4;color:#6a5550}
.hero-lead span{color:var(--accent-2);font-weight:700}
.hero .btn{margin-bottom:0;padding:11px 22px;font-size:.9rem;box-shadow:0 5px 16px rgba(163,72,86,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:var(--radius-sm);font-weight:650;color:#fff;text-decoration:none;background:linear-gradient(145deg,var(--accent-light),var(--accent-2));box-shadow:0 4px 14px rgba(163,72,86,.26);border:0;transition:transform .15s ease,box-shadow .2s ease,filter .2s;position:relative}
.btn:hover{box-shadow:0 6px 18px rgba(163,72,86,.34),0 0 0 1px rgba(201,149,74,.18);transform:translateY(-1px);filter:saturate(1.05)}
.btn:active{transform:scale(.97)}
@keyframes heroIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#catalog{position:relative;padding:6px 0 8px;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:20px;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(196,93,106,.05),transparent 60%)}
.catalog-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.title{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.3;color:var(--text);display:inline-flex;align-items:center;gap:10px}
.title::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(145deg,var(--accent-light),var(--warm));box-shadow:0 0 0 3px rgba(196,93,106,.12);flex-shrink:0}
.sort-wrap{position:relative;flex-shrink:0}
.sort-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0;background:transparent;font-weight:500;font-size:.88rem;color:var(--muted);transition:color .15s}
.sort-btn:hover{color:var(--text)}
.sort-btn svg{width:14px;height:14px;opacity:.55;transition:transform .2s}
.sort-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sort-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:12rem;padding:5px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg)}
.sort-menu[hidden]{display:none !important}
.sort-option{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:10px;font-weight:550;font-size:.9rem}
.sort-option:hover,.sort-option.is-active{background:var(--accent-soft);color:var(--accent-2)}
.tabs{
  display:flex;flex-wrap:nowrap;gap:0;margin:0 0 20px;padding:0;
  border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;overscroll-behavior-y:none;
  touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:12px 18px 14px;margin-bottom:-1px;
  font-weight:500;font-size:.92rem;letter-spacing:-.01em;color:var(--muted);
  border-bottom:2px solid transparent;border-radius:10px 10px 0 0;
  transition:color .15s,border-color .15s,background .15s;
  touch-action:pan-x;
}
.tab:hover{color:var(--text);background:rgba(248,232,234,.45)}
.tab.active{color:var(--accent-2);font-weight:650;border-bottom-color:var(--accent);background:rgba(248,232,234,.55)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}
.card,.product-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;height:100%;min-width:0;position:relative;
  box-shadow:0 4px 15px rgba(139,0,0,.05);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s;
}
.card:hover,.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(139,0,0,.1),0 4px 12px rgba(58,42,40,.06);
  border-color:#e0cfc6;
}
.card.is-info,.card.is-info:hover{z-index:8;transform:none;box-shadow:0 4px 15px rgba(139,0,0,.05)}
.card-title{display:block}
.card-title h3{margin:0}
.badge-tag{
  position:absolute;top:8px;left:8px;z-index:3;
  max-width:calc(100% - 48px);padding:5px 12px;border-radius:999px;
  background:rgba(148,58,72,.78);
  color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.01em;line-height:1.2;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 2px 10px rgba(163,72,86,.22);
  backdrop-filter:blur(8px) saturate(1.15);
  -webkit-backdrop-filter:blur(8px) saturate(1.15);
  pointer-events:none;white-space:nowrap;
}
.info-btn{
  position:absolute;top:8px;right:8px;z-index:5;
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;font-size:.78rem;font-weight:700;font-style:italic;
  color:var(--accent-2);background:rgba(255,255,255,.92);border:1px solid #e8cfd3;
  box-shadow:0 2px 8px rgba(58,42,40,.08);
  transition:background .15s,color .15s,transform .15s,border-color .15s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.info-btn:hover,.info-btn:focus-visible{background:var(--accent);color:#fff;border-color:transparent;outline:0}
.card-info{
  position:absolute;inset:0;z-index:8;padding:14px;border-radius:inherit;
  background:linear-gradient(165deg,#fffaf8,#fff);
  display:flex;flex-direction:column;gap:8px;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(6px);transition:opacity .2s ease,transform .2s ease,visibility .2s;
  overflow:auto;-webkit-overflow-scrolling:touch;
}
.card.is-info{z-index:8}
.card.is-info .card-info{
  opacity:1;visibility:visible;pointer-events:auto;transform:none;
}
@media (hover:hover) and (pointer:fine){
  .card:has(.info-btn:hover) .card-info,
  .card:has(.card-info:hover) .card-info{
    opacity:1;visibility:visible;pointer-events:auto;transform:none;
  }
}
.card-info__head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-info__head strong{font-size:.88rem;font-weight:650;line-height:1.3;letter-spacing:-.01em}
.info-close{width:28px;height:28px;border-radius:8px;background:var(--bg-soft);color:var(--muted);font-size:1.1rem;line-height:1;flex-shrink:0}
.info-close:hover{background:#eadfd8;color:var(--text)}
.card-info__block{display:flex;flex-direction:column;gap:2px}
.card-info__label{font-size:.68rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card-info__text{font-size:.82rem;font-weight:500;line-height:1.4;color:var(--text)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:.9rem;font-weight:600;line-height:1.35;min-height:calc(1.35em * 2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;background:#faf6f4;overflow:hidden}
.ph-art{
  width:108%;height:auto;max-height:none;object-fit:contain;display:block;opacity:.92;
  transform:translateY(-4%);transform-origin:center center;
  transition:transform .3s ease;
}
.product-image{
  width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:14px;
  transform-origin:center center;transition:transform .3s ease;
}
.ph.has-img{background:#fff;display:block}
.ph.has-img .product-image{position:absolute;inset:0}
.product-card:hover .product-image{transform:scale(1.06)}
.product-card:hover .ph-art{transform:translateY(-4%) scale(1.06)}
.product-card.is-info:hover .product-image{transform:none}
.product-card.is-info:hover .ph-art{transform:translateY(-4%)}
.card-price-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:auto}
.price{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;line-height:1.15;color:#8f3644}
.stock{display:inline-flex;align-items:center;gap:6px;color:#9a746c;font-size:.76rem;font-weight:500;white-space:nowrap;flex-shrink:0}
.stock::before{
  content:"";width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:#3eaa62;box-shadow:0 0 0 0 rgba(62,170,98,.45);
  animation:stockPulse 1.8s ease-out infinite;
}
@keyframes stockPulse{
  0%{box-shadow:0 0 0 0 rgba(62,170,98,.45)}
  70%{box-shadow:0 0 0 6px rgba(62,170,98,0)}
  100%{box-shadow:0 0 0 0 rgba(62,170,98,0)}
}
.card .btn{
  width:100%;padding:12px;font-size:.9rem;font-weight:700;border-radius:11px;
  background:linear-gradient(145deg,#c45d6a,#8f3644);
  box-shadow:0 4px 14px rgba(143,54,68,.28);
}
.card .btn:hover{box-shadow:0 6px 18px rgba(143,54,68,.38);filter:saturate(1.08)}
.card-stepper{
  display:flex;align-items:center;gap:6px;margin-top:4px;
  background:#fff;border:1.5px solid #d4a0a8;border-radius:11px;padding:3px;
  box-shadow:inset 0 1px 2px rgba(58,42,40,.04);
}
.card-stepper button{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(145deg,#c45d6a,#8f3644);color:#fff;
  font-size:1.2rem;font-weight:700;line-height:1;
  box-shadow:0 2px 8px rgba(143,54,68,.22);
  transition:transform .12s ease,filter .15s;
}
.card-stepper button:hover{filter:brightness(1.06)}
.card-stepper button:active{transform:scale(.94)}
.card-stepper output{flex:1;text-align:center;font-weight:800;font-size:1.05rem;color:var(--text)}
.catalog-empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);font-weight:550;background:rgba(255,255,255,.7);border:1px dashed var(--line);border-radius:var(--radius)}
.more-wrap{margin:20px 0 36px;text-align:center;color:var(--muted);font-weight:500;font-size:.84rem}
footer{border-top:1px solid var(--line);padding:24px 0 36px;background:linear-gradient(180deg,#f4ece8,#efe6e0);margin-top:12px}
.foot-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:start}
.foot-col h4{font-size:.95rem;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.foot-col p{color:var(--muted);font-size:.9rem;margin-bottom:4px}
.foot-col a{color:var(--accent-2);font-weight:650;text-decoration:none;border-bottom:1px solid transparent}
.foot-col a:hover{border-bottom-color:rgba(163,72,86,.35)}
.foot-map{min-width:0}
.foot-map__frame{
  position:relative;width:100%;aspect-ratio:16/11;min-height:160px;max-height:220px;
  border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:var(--bg-soft);box-shadow:var(--shadow-sm);
}
.foot-map__frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.foot-map__link{display:inline-block;margin-top:8px;font-size:.86rem}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(40,28,26,.46);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:.25s}
.overlay.open{opacity:1;visibility:visible}
.modal{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border-radius:20px;padding:20px;transform:translateY(12px) scale(.98);transition:.25s;box-shadow:var(--shadow-lg)}
.overlay.open .modal{transform:none}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-head h2{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.close{width:38px;height:38px;border-radius:11px;background:var(--bg-soft);font-size:1.35rem;color:var(--muted)}
.close:hover{background:#eadfd8}
.cart-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item-name{font-weight:600;font-size:.93rem}
.item-sub{color:var(--muted);font-size:.8rem}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:8px;background:var(--bg-soft);font-weight:700;color:var(--accent-2)}
.qty .del{width:auto;padding:0 8px;color:var(--danger);background:transparent;font-size:.82rem}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600}
.total strong{font-size:1.3rem;font-weight:700;color:var(--accent-2)}
.field{margin-bottom:11px}
.field label{display:block;font-size:.8rem;font-weight:550;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);outline:0;background:var(--bg);font:inherit}
.field textarea{min-height:72px;resize:vertical;line-height:1.45}
.field input:focus,.field textarea:focus{border-color:var(--accent-light);box-shadow:0 0 0 3px rgba(196,93,106,.14)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.field-row{grid-template-columns:1fr}}
.foot-note{font-size:.84rem;line-height:1.5;color:var(--muted);margin-top:6px;padding:10px 12px;background:rgba(255,255,255,.55);border-radius:12px;border:1px solid var(--line)}
.error{color:var(--danger);font-size:.86rem;font-weight:600;min-height:1.2em;margin-bottom:8px}
.note{color:var(--muted);font-size:.8rem;text-align:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;z-index:200;transform:translate(-50%,120%);background:#3a2a28;color:#fff;padding:11px 18px;border-radius:12px;font-weight:550;font-size:.9rem;opacity:0;transition:.3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.wa-float{position:fixed;right:18px;bottom:18px;z-index:40;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#25D366;color:#fff;box-shadow:0 6px 20px rgba(37,211,102,.38);transition:transform .2s ease}
.wa-float:hover{transform:scale(1.06)}
.wa-float svg{width:26px;height:26px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){
  .container{padding:0 16px}
  header{
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  header .container{
    padding-left:0;
    padding-right:0;
    width:100%;
    max-width:none;
  }
  .head-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:
      "logo cart"
      "search search";
    align-items:center;
    column-gap:12px;
    row-gap:10px;
    padding:12px 0 14px;
    box-sizing:border-box;
  }
  .logo{
    grid-area:logo;justify-self:start;align-self:center;
    max-width:min(360px,calc(100% - 52px));
    margin:0;padding:0;
    transform:translateY(-4px);
  }
  .logo img{height:92px}
  .head-right{
    grid-area:cart;justify-self:end;align-self:center;
    padding:0;margin:0;
  }
  .cart-btn{width:48px;height:48px;border-radius:13px}
  .cart-btn svg{width:22px;height:22px}
  .head-search{
    grid-area:search;width:100%;min-width:0;margin:0;padding:0;
    box-sizing:border-box;
  }
  .head-search input{
    height:44px;padding:0 44px 0 14px;width:100%;box-sizing:border-box;
  }
  .head-search svg.search-icon{right:14px}
  .head-search__clear{right:10px;width:30px;height:30px}
  .hero{
    padding:18px 14px 16px;margin-top:10px;margin-bottom:22px;
    min-height:280px;place-items:center;
    background-position:center 28%;
  }
  .hero-inner{
    width:100%;max-width:20rem;padding:10px 12px 11px;border-radius:12px;
    background:rgba(255,252,250,.88);
  }
  .hero h1{font-size:1.15rem;max-width:18ch;margin-bottom:4px;line-height:1.2}
  .hero-lead{font-size:.78rem;line-height:1.35;margin-bottom:10px;max-width:28ch}
  .hero .btn{margin-bottom:0;width:100%;padding:9px 14px;font-size:.84rem}
  .price{font-size:1.22rem}
  .card .btn{padding:11px;font-size:.86rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
  .sort-wrap .sort-label{display:none}
  .tab{padding:12px 14px 14px}
}
@media (max-width:380px){
  .grid{grid-template-columns:minmax(0,1fr);gap:14px;max-width:100%;margin:0 auto}
  .card,.product-card{max-width:100%}
  .logo img{height:84px}
}
@media (max-width:480px){
  .card h3{font-size:.86rem}
}
@media (prefers-reduced-motion:reduce){
  .hero{animation:none}
  .card,.product-card,.cart-btn,.wa-float,.btn,.product-image,.ph-art{transition:none}
  .stock::before{animation:none!important}
  .product-card:hover .product-image,.product-card:hover .ph-art{transform:none}
}
</style>
</head>
<body>
<header>
  <div class="container head-row">
    <a class="logo" href="#top" id="shopLogoLink" aria-label="Сладкий уголок">
      <img id="shopLogo" src="/img/logo.png?v=4" alt="Сладкий уголок" width="420" height="96" decoding="async">
    </a>
    <div class="head-search" id="headSearch">
      <input type="search" id="catalogSearch" placeholder="Найти товар…" autocomplete="off" aria-label="Поиск">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <button type="button" class="head-search__clear" id="searchClear" aria-label="Очистить поиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="search-suggest" id="searchSuggest" hidden></div>
    </div>
    <div class="head-right">
      <button class="cart-btn" id="cartBtn" aria-label="Корзина">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.5L22 7H6"/></svg>
        <span class="badge" id="badge">0</span>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <div class="container">
    <div class="hero">
      <div class="hero-inner">
        <h1>Свежие торты и десерты ручной работы</h1>
        <p class="hero-lead">Выберите на витрине и оформите бронь в <span>WhatsApp</span> за пару кликов.</p>
        <a class="btn" href="#catalog">Смотреть витрину</a>
      </div>
    </div>

    <section id="catalog">
      <div class="catalog-head">
        <h2 class="title">Каталог</h2>
        <div class="sort-wrap" id="sortWrap">
          <button type="button" class="sort-btn" id="sortBtn" aria-expanded="false">
            <span class="sort-label">Сортировка · </span><span id="sortBtnText">По названию</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="sort-menu" id="sortMenu" hidden>
            <button type="button" class="sort-option is-active" data-sort="name">По названию</button>
            <button type="button" class="sort-option" data-sort="price-asc">Сначала дешевле</button>
            <button type="button" class="sort-option" data-sort="price-desc">Сначала дороже</button>
          </div>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
      <div class="more-wrap" id="moreWrap"></div>
    </section>
  </div>
</main>

<footer>
  <div class="container foot-grid">
    <div class="foot-col">
      <h4>Контакты</h4>
      <p id="footPhone"></p>
      <p><a id="waLink" href="#" target="_blank" rel="noopener">Написать в WhatsApp</a></p>
    </div>
    <div class="foot-col">
      <h4>Магазин</h4>
      <p id="footAddress"></p>
      <p id="footHours"></p>
      <p id="footDelivery"></p>
      <p class="foot-note" id="footPrepay"></p>
    </div>
    <div class="foot-col foot-map">
      <h4>Как добраться</h4>
      <div class="foot-map__frame">
        <iframe
          id="mapFrame"
          title="Карта — самовывоз"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        ></iframe>
      </div>
      <a class="foot-map__link" id="mapLink" href="#" target="_blank" rel="noopener">Открыть в Яндекс Картах</a>
    </div>
  </div>
</footer>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2>Корзина</h2>
      <button class="close" id="closeBtn" aria-label="Закрыть">×</button>
    </div>
    <div id="cartEmpty" class="catalog-empty" style="padding:28px">Корзина пуста</div>
    <div id="cartList"></div>
    <div class="total" id="totalRow" hidden><span>Итого</span><strong id="total">0 ₽</strong></div>
    <form id="orderForm" hidden>
      <div class="field"><label for="name">Имя</label><input id="name" name="name" required maxlength="60" autocomplete="name"></div>
      <div class="field"><label for="phone">Телефон</label><input id="phone" name="phone" required inputmode="tel" maxlength="18" autocomplete="tel"></div>
      <div class="field-row">
        <div class="field"><label for="orderDate">Желаемая дата</label><input id="orderDate" name="orderDate" type="date"></div>
        <div class="field"><label for="orderTime">Время</label><input id="orderTime" name="orderTime" type="text" maxlength="40" placeholder="14:00–16:00"></div>
      </div>
      <div class="field"><label for="orderComment">Комментарий</label><textarea id="orderComment" name="orderComment" maxlength="500" placeholder="Надпись на торте, аллергии, самовывоз или адрес доставки…"></textarea></div>
      <div class="error" id="error"></div>
      <button class="btn" type="submit" style="width:100%">Оформить в WhatsApp</button>
      <p class="note">Откроется WhatsApp с готовым сообщением</p>
    </form>
  </div>
</div>

<a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
</a>

<script>
const SHOP_NAME = "Сладкий уголок";
const WHATSAPP_PHONE = "79000000000";
const WA_GREETING = "Здравствуйте! Хочу уточнить по сладостям.";
const SHOP_ADDRESS = "г. Казань, ул. Баумана, 12 (вход со двора)";
const SHOP_MAP_QUERY = "Казань, улица Баумана, 12";
const SHOP_HOURS = "Пн–Сб 10:00–20:00, Вс 11:00–18:00";
const SHOP_DELIVERY = "Самовывоз из кондитерской. Доставка по городу — от 500 ₽, от 3000 ₽ бесплатно.";
const SHOP_PREPAY = "Торты и крупные заказы — предоплата 50% по СБП после согласования в WhatsApp.";
/** Публичный адрес сайта без слэша в конце, напр. https://sweet.vercel.app — для превью при шаринге */
const SITE_URL = "";
const HIDE_ZERO_STOCK = true;
const PAGE_SIZE = 24;
const CART_KEY = "lvl1_sweet_cart_v1";

const CATEGORIES = [
  { id: "cakes", label: "Торты" },
  { id: "pastry", label: "Выпечка" },
  { id: "chocolate", label: "Шоколад" },
  { id: "candy", label: "Конфеты" },
  { id: "gifts", label: "Наборы" }
];
const CAT_LABEL = Object.fromEntries(CATEGORIES.map((c) => [c.id, c.label]));
const PLACEHOLDER_IMG = "/img/ph-sweet.jpg";
/** Демо-бейджи на карточках (можно также передать badge из прайса) */
const PRODUCT_BADGES = {
  "Торт «Красный бархат»": "Хит 🔥",
  "Торт «Наполеон»": "Новинка ✨"
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cssEscape = (s) => (window.CSS && typeof CSS.escape === "function" ? CSS.escape(String(s)) : String(s).replace(/["\\]/g, "\\$&"));
const norm = (s) => String(s).toLowerCase().replace(/ё/g, "е");
const rub = (n) => Number(n).toLocaleString("ru-RU") + " ₽";

document.title = SHOP_NAME;
const logoImg = $("#shopLogo");
if (logoImg) {
  logoImg.alt = SHOP_NAME;
  $("#shopLogoLink")?.setAttribute("aria-label", SHOP_NAME);
}
(function syncShareMeta() {
  const origin = (SITE_URL || location.origin || "").replace(/\/$/, "");
  const abs = (path) => (origin ? origin + path : path);
  const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
  set('meta[property="og:title"]', "content", SHOP_NAME);
  set('meta[property="og:site_name"]', "content", SHOP_NAME);
  set('meta[property="og:image"]', "content", abs("/img/og-cover.jpg"));
  set('meta[name="twitter:title"]', "content", SHOP_NAME);
  set('meta[name="twitter:image"]', "content", abs("/img/og-cover.jpg"));
  if (origin) {
    let url = document.querySelector('meta[property="og:url"]');
    if (!url) {
      url = document.createElement("meta");
      url.setAttribute("property", "og:url");
      document.head.appendChild(url);
    }
    url.setAttribute("content", origin + "/");
  }
})();

let PRODUCTS = [];
let catalogFailed = false;
const productById = new Map();
let cart = {};
let activeCat = CATEGORIES[0].id;
let searchQuery = "";
let sortMode = "name";
let shown = 0;
let catalogIO = null;

function buildKey(p) {
  const cat = CATEGORIES.find((c) => c.id === p.cat);
  return norm([p.name, p.size || "", cat ? cat.label : ""].join(" "));
}
function setProducts(list) {
  catalogFailed = false;
  PRODUCTS = list.map((p) => ({
    ...p,
    id: String(p.id),
    size: p.size || "",
    key: buildKey(p),
    catLabel: CAT_LABEL[p.cat] || CAT_LABEL.gifts,
    img: p.img || null,
    desc: p.desc || "",
    composition: p.composition || "",
    allergens: p.allergens || ""
  })).filter((p) => !HIDE_ZERO_STOCK || (typeof p.stock !== "number") || p.stock > 0);
  productById.clear();
  PRODUCTS.forEach((p) => productById.set(p.id, p));
}
function setUnavailable() { catalogFailed = true; PRODUCTS = []; productById.clear(); }

async function loadCatalog() {
  try {
    let res = await fetch("/api/products");
    if (!res.ok) res = await fetch("/data/catalog.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data?.products?.length) throw new Error("empty");
    return data.products;
  } catch (e) {
    console.warn(e);
    try {
      const res2 = await fetch("/data/catalog.json");
      if (!res2.ok) throw new Error("HTTP " + res2.status);
      const data2 = await res2.json();
      if (!data2?.products?.length) throw new Error("empty");
      return data2.products;
    } catch (e2) {
      console.warn(e2);
      return null;
    }
  }
}

function loadCart() {
  try {
    const raw = JSON.parse(localStorage.getItem(CART_KEY) || "{}");
    const clean = {};
    for (const [id, q] of Object.entries(raw)) {
      if (productById.has(String(id)) && Number.isInteger(q) && q > 0) clean[id] = Math.min(q, 99);
    }
    return clean;
  } catch { return {}; }
}
function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch {} }

const cartCount = () => Object.values(cart).reduce((a, b) => a + b, 0);
const cartTotal = () => Object.entries(cart).reduce((s, [id, q]) => s + (productById.get(String(id))?.price || 0) * q, 0);

function getFiltered() {
  const words = norm(searchQuery).split(/\s+/).filter(Boolean);
  let list = !words.length
    ? PRODUCTS.filter((p) => p.cat === activeCat)
    : PRODUCTS.filter((p) => words.every((w) => p.key.includes(w)));
  if (sortMode === "price-asc") list = list.slice().sort((a, b) => a.price - b.price || a.name.localeCompare(b.name, "ru"));
  else if (sortMode === "price-desc") list = list.slice().sort((a, b) => b.price - a.price || a.name.localeCompare(b.name, "ru"));
  else list = list.slice().sort((a, b) => a.name.localeCompare(b.name, "ru"));
  return list;
}

function renderNav() {
  $("#tabs").innerHTML = CATEGORIES.map((c) =>
    `<button type="button" class="tab" data-cat="${c.id}">${c.label}</button>`
  ).join("");
}
function cardActions(id) {
  const q = cart[String(id)] || 0;
  if (q <= 0) return `<button class="btn" data-add="${id}">В корзину</button>`;
  return `<div class="card-stepper"><button type="button" data-dec="${id}">−</button><output>${q}</output><button type="button" data-inc="${id}">+</button></div>`;
}
function phFallback(badgeHtml = "") {
  return `<div class="ph">${badgeHtml}<img class="ph-art" src="${PLACEHOLDER_IMG}" alt="" loading="lazy"></div>`;
}
function cardHTML(p) {
  const badgeText = (p.badge && String(p.badge).trim()) || PRODUCT_BADGES[p.name] || "";
  const badgeHtml = badgeText ? `<span class="badge-tag">${esc(badgeText)}</span>` : "";
  const img = p.img
    ? `<div class="ph has-img">${badgeHtml}<img class="product-image" src="${esc(p.img)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.remove('has-img');this.parentElement.insertAdjacentHTML('beforeend','<img class=ph-art src=\\'${PLACEHOLDER_IMG}\\' alt=\\'\\' loading=lazy>')"></div>`
    : phFallback(badgeHtml);
  const stock = typeof p.stock === "number"
    ? (p.stock <= 3 ? `В наличии · ${p.stock}` : "В наличии")
    : "В наличии";
  const hasInfo = !!(p.desc || p.composition || p.allergens || p.size);
  const infoBtn = hasInfo
    ? `<button type="button" class="info-btn" data-info="${esc(p.id)}" aria-label="Подробнее о товаре" title="Подробнее">i</button>`
    : "";
  const infoPanel = hasInfo ? `
    <div class="card-info" data-info-panel="${esc(p.id)}">
      <div class="card-info__head">
        <strong>${esc(p.name)}</strong>
        <button type="button" class="info-close" data-info-close="${esc(p.id)}" aria-label="Закрыть">×</button>
      </div>
      ${p.desc ? `<div class="card-info__block"><span class="card-info__label">Описание</span><span class="card-info__text">${esc(p.desc)}</span></div>` : ""}
      ${p.composition ? `<div class="card-info__block"><span class="card-info__label">Состав</span><span class="card-info__text">${esc(p.composition)}</span></div>` : ""}
      ${p.size ? `<div class="card-info__block"><span class="card-info__label">Вес / фасовка</span><span class="card-info__text">${esc(p.size)}</span></div>` : ""}
      ${p.allergens ? `<div class="card-info__block"><span class="card-info__label">Аллергены</span><span class="card-info__text">${esc(p.allergens)}</span></div>` : ""}
    </div>` : "";
  return `<article class="card product-card" data-product="${esc(p.id)}">${infoBtn}${img}<div class="card-body"><h3>${esc(p.name)}</h3><div class="card-price-row"><div class="price">${rub(p.price)}</div><span class="stock">${stock}</span></div><div class="card-actions">${cardActions(p.id)}</div></div>${infoPanel}</article>`;
}
function syncTabs() {
  const q = searchQuery.trim();
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", !q && t.dataset.cat === activeCat));
}
function renderCatalog() {
  syncTabs();
  shown = 0;
  if (catalogIO) { catalogIO.disconnect(); catalogIO = null; }
  $("#grid").innerHTML = "";
  appendCatalog();
}
function appendCatalog() {
  syncTabs();
  const list = getFiltered();
  if (!list.length) {
    $("#grid").innerHTML = `<p class="catalog-empty">${catalogFailed ? "Каталог недоступен. Загрузите прайс в админке." : PRODUCTS.length ? "Ничего не найдено" : "Загружаем…"}</p>`;
    $("#moreWrap").textContent = "";
    return;
  }
  const next = list.slice(shown, shown + PAGE_SIZE);
  if (shown === 0) $("#grid").innerHTML = next.map(cardHTML).join("");
  else $("#grid").insertAdjacentHTML("beforeend", next.map(cardHTML).join(""));
  shown += next.length;
  $("#moreWrap").textContent = shown >= list.length ? `Все товары · ${list.length}` : `Показано ${shown} из ${list.length}`;
  if (shown < list.length) {
    if (catalogIO) catalogIO.disconnect();
    const tip = document.createElement("div");
    tip.id = "sentinel"; tip.style.height = "1px";
    $("#moreWrap").appendChild(tip);
    catalogIO = new IntersectionObserver((ents) => {
      if (ents.some((e) => e.isIntersecting)) { catalogIO.disconnect(); appendCatalog(); }
    }, { rootMargin: "400px" });
    catalogIO.observe(tip);
  }
}
function updateCard(id) {
  const slot = document.querySelector(`.card[data-product="${id}"] .card-actions`);
  if (slot) slot.innerHTML = cardActions(id);
}
function updateBadge() {
  const n = cartCount();
  const b = $("#badge");
  b.textContent = n;
  b.classList.toggle("show", n > 0);
}
function renderCart() {
  const ids = Object.keys(cart);
  $("#cartEmpty").hidden = ids.length > 0;
  $("#totalRow").hidden = !ids.length;
  $("#orderForm").hidden = !ids.length;
  $("#cartList").innerHTML = ids.map((id) => {
    const p = productById.get(String(id)); const q = cart[id];
    if (!p) return "";
    return `<div class="cart-item"><div><div class="item-name">${esc(p.name)}</div><div class="item-sub">${p.size ? esc(p.size) + " · " : ""}${rub(p.price)}</div><div class="qty"><button type="button" data-dec="${id}">−</button><span>${q}</span><button type="button" data-inc="${id}">+</button><button type="button" class="del" data-del="${id}">удалить</button></div></div><strong>${rub(p.price * q)}</strong></div>`;
  }).join("");
  $("#total").textContent = rub(cartTotal());
}
function changeQty(id, delta) {
  const key = String(id);
  const next = (cart[key] || 0) + delta;
  if (next <= 0) delete cart[key]; else cart[key] = Math.min(next, 99);
  saveCart(); updateBadge(); renderCart(); updateCard(key);
}
function addToCart(id) {
  changeQty(id, 1);
  showToast("Добавлено в корзину");
}
function showToast(t) {
  let el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = t; el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

function hideSuggest() { const b = $("#searchSuggest"); b.hidden = true; b.innerHTML = ""; }
function renderSuggest() {
  const box = $("#searchSuggest"); const input = $("#catalogSearch");
  const q = searchQuery.trim();
  if (!q || document.activeElement !== input) return hideSuggest();
  const words = norm(q).split(/\s+/).filter(Boolean);
  const list = PRODUCTS.filter((p) => words.every((w) => p.key.includes(w))).slice(0, 6);
  if (!list.length) { box.innerHTML = `<div class="search-suggest__empty">Ничего не найдено</div>`; box.hidden = false; return; }
  box.innerHTML = list.map((p) => `
    <div class="search-suggest__item" data-suggest-id="${esc(p.id)}">
      <div class="search-suggest__thumb">${p.img ? `<img src="${esc(p.img)}" alt="">` : `<img src="${PLACEHOLDER_IMG}" alt="">`}</div>
      <div><div class="search-suggest__name">${esc(p.name)}</div><div class="search-suggest__price">${rub(p.price)}</div></div>
      <button type="button" class="search-suggest__add" data-suggest-add="${esc(p.id)}" aria-label="В корзину">+</button>
    </div>`).join("");
  box.hidden = false;
}

function openCart() { hideSuggest(); renderCart(); $("#overlay").classList.add("open"); $("#overlay").setAttribute("aria-hidden", "false"); document.body.classList.add("lock"); }
function closeCart() { $("#overlay").classList.remove("open"); $("#overlay").setAttribute("aria-hidden", "true"); document.body.classList.remove("lock"); }

function closeSort() { $("#sortMenu").hidden = true; $("#sortBtn").setAttribute("aria-expanded", "false"); }
function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll(".sort-option").forEach((el) => el.classList.toggle("is-active", el.dataset.sort === mode));
  $("#sortBtnText").textContent = document.querySelector(`.sort-option[data-sort="${mode}"]`).textContent;
  closeSort(); renderCatalog();
}

function setupContacts() {
  const d = WHATSAPP_PHONE.replace(/\D/g, "");
  const pretty = d.length === 11 ? `+${d[0]} (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7, 9)}-${d.slice(9)}` : "+" + d;
  $("#footPhone").textContent = pretty;
  $("#waLink").href = "https://wa.me/" + d;
  $("#waFloat").href = "https://wa.me/" + d + "?text=" + encodeURIComponent(WA_GREETING);
  $("#footAddress").textContent = SHOP_ADDRESS;
  $("#footHours").textContent = SHOP_HOURS;
  $("#footDelivery").textContent = SHOP_DELIVERY;
  $("#footPrepay").textContent = SHOP_PREPAY;
  const mapQ = encodeURIComponent(SHOP_MAP_QUERY || SHOP_ADDRESS);
  const mapFrame = $("#mapFrame");
  const mapLink = $("#mapLink");
  if (mapFrame) mapFrame.src = "https://yandex.ru/map-widget/v1/?text=" + mapQ + "&z=16";
  if (mapLink) mapLink.href = "https://yandex.ru/maps/?text=" + mapQ;
  const dateEl = $("#orderDate");
  if (dateEl) {
    const t = new Date();
    dateEl.min = t.toISOString().slice(0, 10);
  }
}

$("#orderForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!cartCount()) return;
  const name = $("#name").value.trim();
  const phone = $("#phone").value.trim();
  if (!name || phone.replace(/\D/g, "").length < 10) {
    $("#error").textContent = "Укажите имя и телефон";
    return;
  }
  const lines = Object.entries(cart).map(([id, q], i) => {
    const p = productById.get(String(id));
    return `${i + 1}) ${p.name}${p.size ? ", " + p.size : ""} x${q} — ${(p.price * q).toLocaleString("ru-RU")} руб.`;
  });
  const orderDate = $("#orderDate").value;
  const orderTime = $("#orderTime").value.trim();
  const orderComment = $("#orderComment").value.trim();
  const whenParts = [];
  if (orderDate) {
    const [y, m, d] = orderDate.split("-");
    whenParts.push(`${d}.${m}.${y}`);
  }
  if (orderTime) whenParts.push(orderTime);
  const whenLine = whenParts.length ? "Когда: " + whenParts.join(", ") : "";
  const commentLine = orderComment ? "Комментарий: " + orderComment : "";
  const text = [
    "Заказ с сайта " + SHOP_NAME,
    "Покупатель: " + name + " (" + phone + ")",
    whenLine,
    commentLine,
    "Состав:",
    ...lines,
    "Итого: " + cartTotal().toLocaleString("ru-RU") + " руб."
  ].filter(Boolean).join("\n");
  window.open("https://wa.me/" + WHATSAPP_PHONE.replace(/\D/g, "") + "?text=" + encodeURIComponent(text), "_blank");
});

document.addEventListener("click", (e) => {
  const closeInfo = e.target.closest("[data-info-close]");
  if (closeInfo) {
    e.preventDefault();
    e.stopPropagation();
    const id = closeInfo.getAttribute("data-info-close");
    document.querySelector(`.card[data-product="${cssEscape(id)}"]`)?.classList.remove("is-info");
    return;
  }
  const infoBtn = e.target.closest("[data-info]");
  if (infoBtn) {
    e.preventDefault();
    e.stopPropagation();
    const id = infoBtn.getAttribute("data-info");
    const card = document.querySelector(`.card[data-product="${cssEscape(id)}"]`);
    if (!card) return;
    const open = card.classList.contains("is-info");
    document.querySelectorAll(".card.is-info").forEach((c) => c.classList.remove("is-info"));
    if (!open) card.classList.add("is-info");
    return;
  }
  if (!e.target.closest(".card.is-info")) {
    document.querySelectorAll(".card.is-info").forEach((c) => c.classList.remove("is-info"));
  }

  if (e.target.closest("[data-suggest-add]")) {
    e.preventDefault(); e.stopPropagation();
    return addToCart(e.target.closest("[data-suggest-add]").dataset.suggestAdd);
  }
  if (e.target.closest("[data-suggest-id]") && !e.target.closest("[data-suggest-add]")) {
    hideSuggest();
    document.getElementById("catalog").scrollIntoView({ behavior: "smooth" });
    return;
  }
  if (!e.target.closest(".head-search")) hideSuggest();
  if (!e.target.closest("#sortWrap")) closeSort();

  const t = e.target.closest("[data-add],[data-inc],[data-dec],[data-del],[data-cat],[data-sort]");
  if (!t) return;
  if (t.dataset.add) return addToCart(t.dataset.add);
  if (t.dataset.inc) return changeQty(t.dataset.inc, 1);
  if (t.dataset.dec) return changeQty(t.dataset.dec, -1);
  if (t.dataset.del) return changeQty(t.dataset.del, -cart[t.dataset.del]);
  if (t.dataset.sort) return setSort(t.dataset.sort);
  if (t.dataset.cat) {
    activeCat = t.dataset.cat; searchQuery = ""; $("#catalogSearch").value = "";
    syncSearchClear(); hideSuggest(); renderCatalog();
  }
});

function syncSearchClear() {
  $("#headSearch")?.classList.toggle("is-filled", !!$("#catalogSearch")?.value);
}
$("#catalogSearch").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  syncSearchClear();
  renderCatalog();
  renderSuggest();
});
$("#catalogSearch").addEventListener("focus", () => { if (searchQuery.trim()) renderSuggest(); });
$("#searchClear")?.addEventListener("click", () => {
  const input = $("#catalogSearch");
  input.value = "";
  searchQuery = "";
  syncSearchClear();
  hideSuggest();
  renderCatalog();
  input.focus();
});
$("#searchSuggest").addEventListener("mousedown", (e) => e.preventDefault());
$("#sortBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const m = $("#sortMenu");
  m.hidden = !m.hidden;
  $("#sortBtn").setAttribute("aria-expanded", String(!m.hidden));
});
$("#cartBtn").addEventListener("click", openCart);
$("#closeBtn").addEventListener("click", closeCart);
$("#overlay").addEventListener("click", (e) => { if (e.target === $("#overlay")) closeCart(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    hideSuggest(); closeSort(); closeCart();
    document.querySelectorAll(".card.is-info").forEach((c) => c.classList.remove("is-info"));
  }
});

renderNav();
setupContacts();
renderCatalog();

(async () => {
  const live = await loadCatalog();
  if (live) setProducts(live); else setUnavailable();
  cart = loadCart();
  updateBadge();
  renderCatalog();
})();
</script>
</body>
</html>
